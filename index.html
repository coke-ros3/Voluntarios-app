<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bomberos NI">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/784/784115.png">

    <link rel="manifest" href="manifest.json">

    <title>Alertas Bomberos · Nueva Imperial</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <div class="app">
        <!-- BARRA SUPERIOR -->
        <header class="appbar">
            <h1 class="appbar__title">Bomberos<small>Nueva Imperial · Voluntarios</small></h1>
            <div class="status-pill">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Conectando…</span>
            </div>
        </header>

        <!-- FEED DE EMERGENCIAS -->
        <main class="feed" id="feed">
            <!-- skeleton / tickets renderizados por app.js -->
        </main>

        <!-- BOTÓN FLOTANTE: ACTIVAR ALERTAS -->
        <button class="fab" id="fab-notif" aria-label="Activar alertas push">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </button>
    </div>

    <!-- SHEET DE DETALLE -->
    <div class="backdrop" id="backdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="sheet__handle-zone" id="sheet-handle-zone">
            <div class="sheet__handle"></div>
        </div>

        <div class="sheet__scroll" id="sheet-scroll">
            <div class="sheet__header">
                <div>
                    <div class="sheet__eyebrow">Notificación de despacho</div>
                    <div class="sheet__code" id="sheet-code"></div>
                </div>
                <button class="sheet__close" id="sheet-close" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <div class="terminal">
                <span class="terminal__time" id="terminal-time">--:--:--</span>
                <span class="terminal__date" id="terminal-date">--/--/----</span>
            </div>

            <div class="alert-banner" id="det-atentado">¡Despachado como posible atentado!</div>

            <div class="info-card">
                <span class="info-card__label">Observaciones</span>
                <div class="info-card__value" id="det-obs">Sin observaciones al despacho.</div>
            </div>

            <div class="units-row" id="det-units"></div>

            <div class="map-actions">
                <button class="action-btn" id="btn-waze">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    Waze
                </button>
                <button class="action-btn" id="btn-gmaps">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    Google Maps
                </button>
                <button class="action-btn" id="btn-amaps">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
                    Apple Maps
                </button>
            </div>

            <div class="map-card">
                <div id="map-voluntarios"></div>
                <button class="map-recenter" id="btn-recenter" aria-label="Centrar mapa">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
                </button>
            </div>

            <div class="sheet__footer" id="det-footer-time">—</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
